# Index project modules for Quarkus
quarkus.index-dependency.library.group-id=RytmoServer
quarkus.index-dependency.library.artifact-id=library
quarkus.index-dependency.models.group-id=RytmoServer
quarkus.index-dependency.models.artifact-id=models
quarkus.http.host=0.0.0.0
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) [%X{requestId}] %s%e%n
# General logging level
#quarkus.log.level=DEBUG
#
## Specific Resteasy/Quarkus REST logging (useful for request processing)
## Use 'quarkus.rest' for Quarkus REST or 'org.jboss.resteasy' for legacy RESTEasy
#quarkus.log.category."org.jboss.resteasy".level=DEBUG
#quarkus.log.category."io.quarkus.rest".level=DEBUG
#quarkus.log.category."io.quarkus.vertx.http.runtime.QuarkusErrorHandler".level=TRACE
quarkus.log.category."com.rytmo.library.services.DeframeService".level=DEBUG

# DynamoDB configuration
dynamodb.table.customers=${DYNAMODB_TABLE_CUSTOMERS:${dynamodb.table.customers:customers}}
dynamodb.table.customer-identities=${DYNAMODB_TABLE_CUSTOMER_IDENTITIES:${dynamodb.table.customer-identities:customer-identities}}
dynamodb.device-tokens.table-name=${DYNAMODB_DEVICE_TOKENS_TABLE_NAME:${dynamodb.table.device-tokens:device-tokens}}

# Pagination encryption key
pagination.encryption-key=${PAGINATION_ENCRYPTION_KEY:${pagination.encryption-key}}

# Bridge webhook public key
bridge.webhook.public-key-pem=${BRIDGE_WEBHOOK_PUBLIC_KEY_PEM:${bridge.webhook.public-key-pem:}}

# Bridge API configuration
bridge.api-key=${BRIDGE_API_KEY:${bridge.api-key}}
bridge.base-url=${BRIDGE_BASE_URL:https://api.sandbox.bridge.xyz/v0}
# Blockchain address where funds are returned if a customer transaction fails or is rejected by the destination
bridge.liquidation.return-address=${BRIDGE_LIQUIDATION_RETURN_ADDRESS:}

# Privy configuration
privy.app-id=${PRIVY_APP_ID:${privy.app-id}}
privy.app-secret=${PRIVY_APP_SECRET:${privy.app-secret}}
privy.jwks-url=${PRIVY_JWKS_URL:https://auth.privy.io/api/v1/apps/${privy.app-id}/jwks.json}
privy.solana-caip2=${PRIVY_SOLANA_CAIP2:solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp}

# Metrics / CloudWatch
metrics.cloudwatch.enabled=${METRICS_CLOUDWATCH_ENABLED:false}
metrics.cloudwatch.namespace=${METRICS_CLOUDWATCH_NAMESPACE:rytmo/api}

# DFlow configuration
dflow.base-url=${DFLOW_BASE_URL:https://dev-quote-api.dflow.net}

# Helius configuration
helius.api-key=${HELIUS_API_KEY:}
helius.rpc-url=${HELIUS_RPC_URL:https://mainnet.helius-rpc.com/?api-key=${helius.api-key}}

# Solana / Privy sponsorship
solana.usdc-mint=${SOLANA_USDC_MINT:EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
privy.authorization-key=${PRIVY_AUTHORIZATION_KEY:${privy.authorization-key}}
swap.fee-payer-wallet-id=${SWAP_FEE_PAYER_WALLET_ID:}
swap.fee-payer-wallet-address=${SWAP_FEE_PAYER_WALLET_ADDRESS:}

# Assets CDN base URL (e.g. S3 bucket or CloudFront) — no trailing slash
assets.base-url=${ASSETS_BASE_URL:https://beta-rytmo-assets.s3.mx-central-1.amazonaws.com}

# DFrame configuration
deframe.api-key=${DEFRAME_API_KEY:}
deframe.base-url=${DEFRAME_BASE_URL:https://api.deframe.io}

# Privy webhook configuration
privy.webhook-secret=${PRIVY_WEBHOOK_SECRET:}
