# Index project modules for Quarkus
quarkus.index-dependency.library.group-id=RytmoServer
quarkus.index-dependency.library.artifact-id=library
quarkus.index-dependency.models.group-id=RytmoServer
quarkus.index-dependency.models.artifact-id=models

# DynamoDB configuration
dynamodb.table.customers=${DYNAMODB_TABLE_CUSTOMERS:${dynamodb.table.customers:customers}}
dynamodb.table.customer-identities=${DYNAMODB_TABLE_CUSTOMER_IDENTITIES:${dynamodb.table.customer-identities:customer-identities}}

# Pagination encryption key
pagination.encryption-key=${PAGINATION_ENCRYPTION_KEY:${pagination.encryption-key}}

# Bridge webhook public key
bridge.webhook.public-key-pem=${BRIDGE_WEBHOOK_PUBLIC_KEY_PEM:${bridge.webhook.public-key-pem:}}

# Bridge API configuration
bridge.api-key=${BRIDGE_API_KEY:${bridge.api-key}}
bridge.base-url=${BRIDGE_BASE_URL:https://api.bridge.xyz/v0}

# Privy configuration
privy.app-id=${PRIVY_APP_ID:${privy.app-id}}
privy.jwks-url=${PRIVY_JWKS_URL:https://auth.privy.io/api/v1/apps/${privy.app-id}/jwks.json}
